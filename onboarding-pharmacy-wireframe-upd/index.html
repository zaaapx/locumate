<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Locumate — Pharmacist onboarding (wireframe prototype)</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#212121; --sub:#757575; --line:#D9D9D9; --bg:#F5F5F5; --page:#E6E6E6;
    --req-bg:#FFF0E0; --req-fg:#B85C00; --ok-bg:#E3F5EA; --ok-fg:#2E9E5B; --ai-bg:#E6F7F6; --ai-fg:#1F7F78;
    --dis-bg:#E2E2E2; --dis-fg:#9E9E9E;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Outfit',system-ui,sans-serif;color:var(--ink);background:var(--page);display:flex;justify-content:center;align-items:center;gap:40px;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  input{font:inherit;color:inherit}

  /* side panel (desktop only) */
  .panel{width:240px;max-height:844px;overflow:auto;font-size:13px}
  .panel h1{font-size:16px;font-weight:600;margin-bottom:4px}
  .panel p{color:var(--sub);margin-bottom:16px;line-height:1.4}
  .panel ol{list-style:none;display:flex;flex-direction:column;gap:2px}
  .panel li button{width:100%;text-align:left;padding:6px 10px;border-radius:8px;color:var(--ink)}
  .panel li button:hover{background:#fff}
  .panel li button.on{background:var(--ink);color:#fff}
  .panel .reset{margin-top:16px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}

  /* phone */
  .phone{position:relative;width:390px;height:844px;background:#fff;border-radius:44px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.12)}
  @media (max-width:760px){
    body{display:block;background:#fff}
    .panel{display:none}
    .phone{width:100vw;height:100dvh;border-radius:0;box-shadow:none}
  }
  .status{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 28px 0 32px;font-weight:600;font-size:15px;flex:none}
  .status i{display:inline-block;width:18px;height:10px;border:1.5px solid var(--ink);border-radius:3px;margin-left:6px;position:relative}
  .status i::after{content:"";position:absolute;inset:1px;background:var(--ink);border-radius:1px}
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;background:#fff}
  .scroll{flex:1;overflow-y:auto;padding:8px 16px 16px;-webkit-overflow-scrolling:touch}
  .scroll::-webkit-scrollbar{display:none}
  .foot{padding:12px 16px 34px;display:flex;flex-direction:column;gap:10px;flex:none}
  .homebar{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--ink);z-index:50}

  /* header */
  .hdr{height:56px;display:flex;align-items:center;gap:12px;padding:0 16px;flex:none}
  .back{width:24px;height:24px;display:grid;place-items:center}
  .hdr .title{flex:1;font-weight:600;font-size:17px}
  .prog{flex:1;display:flex;gap:6px}
  .prog span{flex:1;height:4px;border-radius:2px;background:#E2E2E2}
  .prog span.on{background:var(--ink)}
  .skip{font-weight:500;font-size:14px;color:var(--sub)}

  /* type */
  .eyebrow{font-weight:500;font-size:13px;color:var(--sub);margin-bottom:4px}
  h2{font-weight:600;font-size:24px;line-height:1.2}
  .desc{font-size:15px;color:var(--sub);margin-top:4px;line-height:1.35}
  .overline{font-weight:600;font-size:12px;color:var(--sub);letter-spacing:.02em;margin:18px 0 8px}
  .stack{display:flex;flex-direction:column;gap:12px}
  .stack.tight{gap:10px}

  /* buttons */
  .btn{height:56px;border-radius:14px;font-weight:600;font-size:16px;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;transition:opacity .15s}
  .btn:active{opacity:.8}
  .btn.primary{background:var(--ink);color:#fff}
  .btn.secondary{background:#fff;border:1px solid var(--line)}
  .btn.text{height:44px}
  .btn[disabled]{background:var(--dis-bg);color:var(--dis-fg);border:0;cursor:not-allowed}
  .btn.small{height:36px;width:auto;padding:0 16px;font-size:14px;border-radius:10px}
  .link{font-weight:600;font-size:14px}

  /* chips */
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{padding:10px 16px;border-radius:99px;border:1px solid var(--line);font-weight:500;font-size:14px;background:#fff}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}

  /* inputs */
  .field label{display:block;font-weight:500;font-size:13px;color:var(--sub);margin-bottom:6px}
  .field input{width:100%;height:52px;border:1px solid var(--line);border-radius:12px;padding:0 16px;font-size:16px;outline:none}
  .field input:focus{border-color:var(--ink)}
  .field .help{font-size:12px;color:var(--sub);margin-top:6px}

  /* rows */
  .row{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:#fff;text-align:left;width:100%}
  .row .ic{width:40px;height:40px;border-radius:10px;background:var(--bg);flex:none;display:grid;place-items:center}
  .row .tx{flex:1;min-width:0}
  .row .t{font-weight:500;font-size:15px}
  .row .s{font-size:13px;color:var(--sub);margin-top:2px}
  .row .chev{flex:none}
  .row.static{cursor:default}
  .tag{padding:4px 10px;border-radius:99px;font-weight:500;font-size:12px;white-space:nowrap;background:var(--bg);color:var(--ink)}
  .tag.neutral{color:var(--sub)}
  .tag.required{background:var(--req-bg);color:var(--req-fg)}
  .tag.done{background:var(--ok-bg);color:var(--ok-fg)}
  .tag.ai{background:var(--ai-bg);color:var(--ai-fg)}
  .spin{width:12px;height:12px;border:2px solid #cfcfcf;border-top-color:var(--sub);border-radius:50%;display:inline-block;vertical-align:-2px;margin-right:6px;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  .bar{height:6px;border-radius:3px;background:#EEEEEE;overflow:hidden}
  .bar>div{height:100%;background:var(--ink);border-radius:3px;transition:width .3s}
  .note{background:var(--bg);border-radius:12px;padding:14px;font-size:14px;line-height:1.4}

  /* sheet */
  .overlay{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:20;animation:fade .2s}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;z-index:21;padding:12px 0 40px;max-height:calc(100% - 48px);display:flex;flex-direction:column;animation:up .25s ease-out}
  .sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 8px;flex:none}
  .sheet .inner{padding:0 16px;overflow-y:auto}
  .sheet .hdr{padding:0 16px}
  @keyframes up{from{transform:translateY(40px);opacity:.6}}
  @keyframes fade{from{opacity:0}}

  /* otp */
  .otp{display:flex;gap:10px;margin:20px 0 16px}
  .otp div{width:62px;height:64px;border:1px solid var(--line);border-radius:12px;display:grid;place-items:center;font-weight:600;font-size:24px}
  .otp div.cur{border:2px solid var(--ink)}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);background:#F7F7F7;padding:12px 0 40px;margin:0 -16px -40px}
  .keypad button{height:56px;font-size:22px}

  /* photo preview */
  .preview{height:240px;border-radius:16px;background:#E0E0E0;display:grid;place-items:center;margin:16px 0}
  .idcard{width:290px;height:180px;background:#fff;border:1px solid var(--line);border-radius:12px;position:relative}
  .idcard b{position:absolute;background:var(--line);border-radius:4px;height:8px}
  .checks{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
  .checks div{display:flex;gap:10px;align-items:center;font-size:15px}

  /* home */
  .card{background:var(--bg);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
  .card-h{display:flex;align-items:center;justify-content:space-between}
  .card-h b{font-weight:600;font-size:16px}
  .prow{display:flex;align-items:center;gap:10px}
  .prow .bar{flex:1;background:#E6E6E6}
  .prow span{font-weight:500;font-size:13px;color:var(--sub)}
  .next{background:#fff;border-radius:12px;padding:12px;display:flex;align-items:center;gap:12px}
  .shift{border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;text-align:left;width:100%;background:#fff}
  .shift .top{display:flex;gap:12px;align-items:center}
  .shift .logo{width:44px;height:44px;border-radius:10px;background:var(--bg)}
  .shift .name{font-weight:600;font-size:16px}
  .shift .dist{font-size:13px;color:var(--sub)}
  .shift hr{border:0;border-top:1px solid #EEE}
  .shift .ln{display:flex;gap:8px;align-items:flex-start}
  .shift .lb{font-size:12px;color:var(--sub)}
  .shift .v{font-weight:500;font-size:14px}
  .tabs{height:84px;border-top:1px solid var(--line);display:flex;justify-content:space-between;padding:12px 28px 0;flex:none;background:#fff}
  .tabs div{display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:500;font-size:11px;color:var(--sub)}
  .tabs div i{width:24px;height:24px;border-radius:6px;background:var(--line)}
  .tabs div.on{color:var(--ink)}
  .tabs div.on i{background:var(--ink)}
  .notice{background:var(--req-bg);border-radius:16px;padding:16px}
  .notice b{display:block;font-weight:600;font-size:16px;margin-bottom:4px}
  .notice span{font-size:14px;color:#5C3A00}
  .img{height:120px;border-radius:16px;background:var(--bg)}

  .hero{height:260px;border-radius:24px;background:var(--bg);display:grid;place-items:center;color:var(--sub);font-weight:500;font-size:13px;margin:24px 0}
  .or{display:flex;align-items:center;gap:12px;color:var(--sub);font-weight:500;font-size:13px}
  .or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
  .legal{font-size:12px;color:var(--sub);text-align:center;margin-top:4px}
  .social svg{flex:none}

  .toast{position:absolute;left:16px;right:16px;bottom:110px;background:var(--ink);color:#fff;border-radius:12px;padding:12px 16px;font-size:14px;z-index:60;animation:up .2s}
</style>
</head>
<body>
<aside class="panel">
  <h1>Pharmacist onboarding</h1>
  <p>Wireframe prototype. Tap through the flow on the phone, or jump to any screen below. Dummy data only.</p>
  <ol id="nav"></ol>
  <button class="reset" onclick="resetAll()">Restart flow</button>
</aside>
<main class="phone" id="phone"></main>

<script>
/* ---------- icons ---------- */
const I={
  back:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="#212121" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  chev:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M9 18l6-6-6-6" stroke="#9E9E9E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  check:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#E3F5EA"/><path d="M7.5 12.5l3 3 6-6.5" stroke="#2E9E5B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  clock:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#757575" stroke-width="2"/><path d="M12 7v5l3 2" stroke="#757575" stroke-width="2" stroke-linecap="round"/></svg>',
  dollar:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#757575" stroke-width="2"/><path d="M14.5 9.5c0-1.1-1.1-2-2.5-2s-2.5.9-2.5 2 1.1 1.7 2.5 2 2.5.9 2.5 2-1.1 2-2.5 2-2.5-.9-2.5-2M12 6v1.5M12 16.5V18" stroke="#757575" stroke-width="1.6" stroke-linecap="round"/></svg>',
  pin:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z" stroke="#757575" stroke-width="2"/><circle cx="12" cy="9.5" r="2.5" stroke="#757575" stroke-width="2"/></svg>',
  del:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M9 6h11v12H9l-6-6 6-6z" stroke="#212121" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 10l4 4M16 10l-4 4" stroke="#212121" stroke-width="1.6" stroke-linecap="round"/></svg>',
  apple:'<svg width="18" height="18" viewBox="0 0 24 24"><path fill="#000" d="M16.4 12.6c0-2.5 2-3.7 2.1-3.8-1.2-1.7-3-1.9-3.6-2-1.5-.2-3 .9-3.8.9-.8 0-2-.9-3.3-.9-1.7 0-3.3 1-4.2 2.5-1.8 3.1-.5 7.7 1.3 10.2.9 1.2 1.9 2.6 3.2 2.6 1.3-.1 1.8-.8 3.3-.8 1.6 0 2 .8 3.4.8 1.4 0 2.3-1.3 3.1-2.5 1-1.4 1.4-2.8 1.4-2.9-.1 0-2.9-1.1-2.9-4.1zM13.9 5.1c.7-.9 1.2-2.1 1.1-3.3-1 0-2.3.7-3 1.6-.7.8-1.3 2-1.1 3.2 1.1.1 2.3-.6 3-1.5z"/></svg>',
  google:'<svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>'
};

/* ---------- state ---------- */
const DOCS=[
  {id:'id',t:'Photo ID',hint:'Passport or driver licence',req:true,done:'Name, date of birth and address added'},
  {id:'cv',t:'Resume',hint:'PDF',req:true,done:'CV_Andrii.pdf'},
  {id:'ins',t:'Indemnity insurance',hint:'Certificate of currency',req:true,done:'Insurer and expiry date added'},
  {id:'cred',t:'Credential certificates',hint:'One or more files',req:true,done:'2 certificates added'},
  {id:'super',t:'Super choice form',hint:'Fills in your super details',req:false,done:'Fund details added'}
];
const fresh=()=>({stack:['welcome'],social:false,role:'',work:'',email:'andrii@example.com',otp:'',docs:{},idType:'Driver licence',gender:'',sheet:null,photo:null});
let S=fresh();
const SCREENS=[
  ['welcome','00 Welcome'],['role','01 Role'],['roleSheet','02 Required documents'],['account','03 Create account'],['otp','04 Email code'],
  ['docs','05 Documents hub'],['upload','06 Upload options'],['photoFront','06b Check photo · front'],['photoBack','06c Check photo · back'],['docsDone','07 Documents uploaded'],
  ['general','08 Your general info'],['ahpra','09 AHPRA and tax'],['home','10 Home'],['all','10b All required items'],['shift','11 Shift — can\'t apply']
];

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const status=()=>`<div class="status"><span>9:41</span><span><i></i></span></div>`;
const header=({back=true,title='',step=0,skip=false}={})=>`<div class="hdr">${back?`<button class="back" aria-label="Back" onclick="goBack()">${I.back}</button>`:''}${step?`<div class="prog" aria-label="Step ${step} of 5">${[1,2,3,4,5].map(i=>`<span class="${i<=step?'on':''}"></span>`).join('')}</div>`:`<div class="title">${title}</div>`}${skip?'<button class="skip">Skip</button>':''}</div>`;
const titleBlock=(t,d,step)=>`${step?`<div class="eyebrow">Step ${step}/5</div>`:''}<h2>${t}</h2>${d?`<p class="desc">${d}</p>`:''}`;
const tag=(label,kind='')=>label?`<span class="tag ${kind}">${label}</span>`:'';
const row=({t,s,tagL,tagK,chev=true,on='',cls=''})=>`<button class="row ${on?'':'static'} ${cls}" ${on?`onclick="${on}"`:'tabindex="-1"'}><span class="ic"></span><span class="tx"><div class="t">${t}</div>${s?`<div class="s">${s}</div>`:''}</span>${tag(tagL,tagK)}${chev?`<span class="chev">${I.chev}</span>`:''}</button>`;
const chips=(items,sel,fn)=>`<div class="chips">${items.map(x=>`<button class="chip ${x===sel?'on':''}" onclick="${fn}('${x}')">${x}</button>`).join('')}</div>`;
const input=(label,val,help='',type='text',id='')=>`<div class="field"><label>${label}</label><input ${id?`id="${id}"`:''} type="${type}" value="${esc(val)}">${help?`<div class="help">${help}</div>`:''}</div>`;
const btn=(label,cls='primary',on='',dis=false)=>`<button class="btn ${cls}" ${dis?'disabled':''} onclick="${on}">${label}</button>`;
let toastT;
function toast(msg){clearTimeout(toastT);const p=$('#phone');p.querySelector('.toast')?.remove();p.insertAdjacentHTML('beforeend',`<div class="toast">${msg}</div>`);toastT=setTimeout(()=>p.querySelector('.toast')?.remove(),2200);}
function soon(){toast('Not part of this prototype yet');}

/* ---------- navigation ---------- */
function go(id){S.sheet=null;S.stack.push(id);render();}
function goBack(){if(S.sheet){if(S.sheet.name==='photo'&&S.sheet.side==='back'){S.sheet.side='front';return render();} if(S.sheet.name==='photo'){S.sheet={name:'upload',doc:S.sheet.doc};return render();} S.sheet=null;return render();} if(S.stack.length>1){S.stack.pop();} render();}
function openSheet(name,data){S.sheet={name,...(data||{})};render();}
function closeSheet(){S.sheet=null;render();}
function jump(id){
  // set plausible state for direct jumps
  const seq=SCREENS.map(s=>s[0]); const i=seq.indexOf(id);
  if(i>=seq.indexOf('docsDone')&&!Object.keys(S.docs).length){S.docs={id:'done',cv:'done'};}
  if(id==='docs'){S.docs={};}
  S.sheet=null; S.stack=[...seq.slice(0,i+1)].filter(x=>!['roleSheet','otp','upload','photoFront','photoBack'].includes(x)||x===id);
  if(id==='roleSheet'){S.stack=['welcome','role'];return openSheet('docsInfo');}
  if(id==='otp'){S.stack=['welcome','role','account'];return openSheet('otp');}
  if(id==='upload'){S.stack=['welcome','role','account','docs'];S.docs={};return openSheet('upload',{doc:'id'});}
  if(id==='photoFront'){S.stack=['welcome','role','account','docs'];S.docs={};return openSheet('photo',{doc:'id',side:'front'});}
  if(id==='photoBack'){S.stack=['welcome','role','account','docs'];S.docs={};return openSheet('photo',{doc:'id',side:'back'});}
  if(id==='docsDone'){S.stack=['welcome','role','account','docs'];S.docs={id:'done',cv:'done'};}
  render();
}
function resetAll(){S=fresh();render();}

/* ---------- actions ---------- */
function setRole(v){S.role=v;render();}
function setWork(v){S.work=v;render();}
function setGender(v){S.gender=v;render();}
function setIdType(v){S.idType=v;render();}
function startSocial(){S.social=true;go('role');}
function startEmail(){S.social=false;go('role');}
function roleContinue(){openSheet('docsInfo');}
function docsInfoContinue(){S.sheet=null;S.stack.push(S.social?'docs':'account');render();}
function accountContinue(){S.email=($('#email')?.value||S.email);S.otp='';openSheet('otp');startTimer();}
let timerV=42,timerT;
function startTimer(){clearInterval(timerT);timerV=42;timerT=setInterval(()=>{timerV=Math.max(0,timerV-1);const el=$('#resend');if(el)el.textContent=timerV?`resend in 0:${String(timerV).padStart(2,'0')}`:'resend now';if(!timerV)clearInterval(timerT);},1000);}
function key(k){
  if(k==='del')S.otp=S.otp.slice(0,-1); else if(/\d/.test(k)&&S.otp.length<5)S.otp+=k;
  render();
  if(S.otp.length===5){setTimeout(()=>{clearInterval(timerT);S.sheet=null;S.stack.push('docs');render();toast('Email verified');},450);}
}
function openDoc(id){ if(S.docs[id]==='done'||S.docs[id]==='reading') return toast(S.docs[id]==='done'?'Already uploaded':'Still reading this one'); openSheet('upload',{doc:id}); }
function takePhoto(doc){ openSheet('photo',{doc,side:'front'}); }
function chooseFile(doc){ S.sheet=null; readDoc(doc); }
function photoNext(){ const sh=S.sheet; const twoSided=sh.doc==='id'&&S.idType==='Driver licence';
  if(sh.side==='front'&&twoSided) return openSheet('photo',{doc:sh.doc,side:'back'});
  S.sheet=null; readDoc(sh.doc); }
function retake(){ toast('Camera opens again'); }
function readDoc(id){ S.docs[id]='reading'; render(); setTimeout(()=>{S.docs[id]='done'; if(cur()==='docs')render();}, 2200); }
function docsContinue(){ go('general'); }
function cur(){return S.stack[S.stack.length-1];}

/* ---------- screens ---------- */
const V={};
V.welcome=()=>`${status()}<div class="scroll" style="display:flex;flex-direction:column">
  <div class="hero">Illustration / logo</div>
  <h2>Pharmacy shifts on your terms</h2><p class="desc">Find and book locum shifts near you.</p>
  <div style="flex:1;min-height:24px"></div>
  <div class="stack">
    <button class="btn secondary social" onclick="startSocial()">${I.apple} Continue with Apple</button>
    <button class="btn secondary social" onclick="startSocial()">${I.google} Continue with Google</button>
    <div class="or">or</div>
    ${btn('Create an account','primary','startEmail()')}
    ${btn('I already have an account','secondary','soon()')}
    <p class="legal">By continuing, you agree to our Terms and Privacy Policy.</p>
  </div></div><div style="height:34px"></div>`;

V.role=()=>`${status()}${header({step:1})}<div class="scroll">
  ${titleBlock('What do you do?','We\'ll tailor your profile and the shifts you see.',1)}
  <div class="overline">I AM A</div>${chips(['Pharmacist','Dispensary technician','Student / Intern','Retail staff'],S.role,'setRole')}
  <div class="overline">I'M LOOKING FOR</div>${chips(['Full-time / Part-time','Shift work'],S.work,'setWork')}
  </div><div class="foot">${btn('Continue','primary','roleContinue()',!(S.role&&S.work))}</div>`;

V.account=()=>`${status()}${header({step:2})}<div class="scroll stack">
  <div>${titleBlock('Create your account','You can browse shifts right after this.',2)}</div>
  ${input('Email *',S.email,'','email','email')}
  ${input('Password *','password1','At least 8 characters, including a number','password')}
  ${input('Confirm password *','password1','','password')}
  </div><div class="foot">${btn('Continue','primary','accountContinue()')}</div>`;

const docState=()=>{const req=DOCS.filter(d=>d.req);const up=req.filter(d=>S.docs[d.id]).length;const reading=Object.values(S.docs).includes('reading');return {req,up,reading,any:Object.keys(S.docs).length>0};};
const docRow=d=>{const st=S.docs[d.id];
  if(st==='done') return row({t:d.t,s:d.done,tagL:'Done',tagK:'done',on:`openDoc('${d.id}')`});
  if(st==='reading') return row({t:d.t,s:d.id==='cv'?'CV_Andrii.pdf':'Uploaded',tagL:'<span class="spin"></span>Reading…',tagK:'neutral',on:`openDoc('${d.id}')`});
  return row({t:d.t,s:d.req?'Tap to add':d.hint,tagL:d.req?'Required':'Optional',tagK:d.req?'required':'neutral',on:`openDoc('${d.id}')`});};
V.docs=()=>{const {up,reading,any}=docState();return `${status()}${header({step:3})}<div class="scroll">
  ${titleBlock('Upload your documents','We\'ll use them to fill in your profile and show shifts that suit you. Upload a photo or a file.',3)}
  <div style="margin:16px 0 12px"><div class="eyebrow">${up} of 4 required documents uploaded</div><div class="bar"><div style="width:${up/4*100}%"></div></div></div>
  <div class="stack tight">${DOCS.filter(d=>d.req).map(docRow).join('')}</div>
  <div class="overline">OPTIONAL</div><div class="stack tight">${DOCS.filter(d=>!d.req).map(docRow).join('')}</div>
  </div><div class="foot">${any?btn(reading?'Reading your documents…':'Continue','primary','docsContinue()',reading):btn('Upload later','primary','docsContinue()')}</div>`;};
V.docsDone=V.docs;

V.general=()=>`${status()}${header({step:4})}<div class="scroll stack">
  <div>${titleBlock('Your general info','',4)}</div>
  ${input('First name *','Andrii')}${input('Last name *','Petrenko')}${input('Date of birth *','19/07/1990')}
  <div class="field"><label>Gender *</label>${chips(['Female','Male','Other'],S.gender,'setGender')}<div class="help">Used for super and AHPRA checks</div></div>
  ${input('Home address *','10 George St, Sydney NSW 2000')}${input('Apartment / unit','Unit 5')}
  </div><div class="foot">${btn('Confirm details','primary','go(\'ahpra\')')}</div>`;

V.ahpra=()=>`${status()}${header({step:5})}<div class="scroll stack">
  <div>${titleBlock('AHPRA and tax details','',5)}</div>
  ${input('AHPRA registration number','PHA0001234567','3 letters and 10 digits, e.g. PHA0001234567')}
  ${input('AHPRA expiry date','12/10/2028')}
  <div class="note">We'll verify it with AHPRA. This usually takes 1 business day.</div>
  ${input('Tax file number (TFN)','123 456 782','We need it to pay you. It\'s stored securely.')}
  </div><div class="foot">${btn('See shifts','primary','go(\'home\')')}</div>`;

const shiftCard=(n,d,date,rate,addr)=>`<button class="shift" onclick="go('shift')"><div class="top"><span class="logo"></span><span style="flex:1"><div class="name">${n}</div><div class="dist">${d}</div></span></div><hr>
  <div class="ln">${I.clock}<span><div class="lb">Date</div><div class="v">${date}</div></span></div>
  <div class="ln">${I.dollar}<span><div class="lb">Hourly rate (excl. super)</div><div class="v">${rate}</div></span></div>
  <div class="ln">${I.pin}<span class="v">${addr}</span></div></button>`;
V.home=()=>`${status()}${header({back:false,title:'Shifts'})}<div class="scroll stack">
  <div class="card"><div class="card-h"><b>Finish your profile</b><button class="link" onclick="go('all')">View all</button></div>
    <div class="prow"><div class="bar"><div style="width:58%"></div></div><span>7 items left</span></div>
    <div class="next"><span class="row ic" style="border:0;padding:0;width:36px;height:36px;border-radius:8px;background:var(--bg)"></span><span style="flex:1"><div class="t" style="font-weight:500;font-size:15px">Credential certificates</div><div class="s" style="font-size:13px;color:var(--sub)">Next up · needed to apply</div></span><button class="btn primary small" onclick="soon()">Upload</button></div>
  </div>
  <div class="overline" style="margin:4px 0 0">SHIFTS NEAR YOU</div>
  ${shiftCard('Priceline Pharmacy','3 km away','Sat 14 Nov · 8:00–17:00','$62.00','120 Crown St, Surry Hills NSW 2010')}
  ${shiftCard('TerryWhite Chemmart','6 km away','Mon 16 Nov · 9:00–18:00','$58.00','285 King St, Newtown NSW 2042')}
  </div><div class="tabs">${['Shifts','Jobs','Calendar','Chat','Profile'].map((t,i)=>`<div class="${i?'':'on'}"><i></i>${t}</div>`).join('')}</div>`;

V.all=()=>`${status()}${header({title:'Finish your profile'})}<div class="scroll">
  ${titleBlock('7 items left','Complete these to apply for shifts.')}
  <div class="overline">TO DO</div><div class="stack tight">
  ${[['Credential certificates','Select your credentials, then upload certificates','Upload'],['Bank details','Takes about 1 minute','Add'],['Super fund','Fund details or choice form','Add'],['Business details','ABN, business name, entity type','Add'],['Immunisation','Are you able to vaccinate?','Add'],['Professional certificates','Immunisation, First Aid, CPR, COVID','Upload'],['Other insurance','Any other policies you hold','Upload']].map(([t,s,l])=>row({t,s,tagL:l,tagK:'required',on:'soon()'})).join('')}</div>
  <div class="overline">GET BETTER MATCHES · OPTIONAL</div><div class="stack tight">
  ${row({t:'Experience and software',s:'Prefilled from your resume',tagL:'Check',tagK:'ai',on:'soon()'})}
  ${row({t:'Work preferences',s:'Days, shift type, preferred states',tagL:'Add',tagK:'neutral',on:'soon()'})}
  ${row({t:'Rate and travel',s:'Hourly rate, distance, longer assignments',tagL:'Add',tagK:'neutral',on:'soon()'})}</div>
  <div class="overline">IN REVIEW</div>${row({t:'AHPRA registration',s:'Usually within 1 business day',tagL:'In review',tagK:'neutral',chev:false})}
  <div class="overline">DONE</div><div class="stack tight">
  ${row({t:'Photo ID',s:'Driver licence',tagL:'Done',tagK:'done',on:'soon()'})}
  ${row({t:'Indemnity insurance',s:'Expires 30/06/2027',tagL:'Done',tagK:'done',on:'soon()'})}
  ${row({t:'Resume',s:'CV_Andrii.pdf',tagL:'Done',tagK:'done',on:'soon()'})}</div><div style="height:24px"></div>
  </div>`;

V.shift=()=>`${status()}${header({title:'Shift'})}<div class="scroll stack">
  <div class="notice"><b>Finish your profile to apply</b><span>Pharmacies can only see complete profiles. You have 7 items left.</span></div>
  <div class="img"></div>
  <div>${titleBlock('Locum Pharmacist','Priceline Pharmacy · Surry Hills NSW')}</div>
  ${row({t:'Sat 14 Nov · 8:00–17:00',s:'9 hours',chev:false})}
  ${row({t:'$62.00 per hour',s:'Excl. super',chev:false})}
  ${row({t:'120 Crown St, Surry Hills NSW 2010',s:'3 km away',chev:false})}
  </div><div class="foot">${btn('Finish profile','primary','go(\'all\')')}${btn('Apply','primary','',true)}</div>`;

/* ---------- sheets ---------- */
const SH={};
SH.docsInfo=()=>`<div class="inner">${titleBlock('Have these documents ready','We\'ll read them and fill most of your profile and apply for the job. You can add them later too.')}
  <div class="overline">REQUIRED</div><div class="stack tight">${DOCS.filter(d=>d.req).map(d=>row({t:d.t,s:d.hint,tagL:'Required',tagK:'required',chev:false})).join('')}</div>
  <div class="overline">OPTIONAL — SAVES TIME</div>${row({t:'Super choice form',tagL:'Optional',tagK:'neutral',chev:false})}
  <div style="height:16px"></div>${btn('Continue','primary','docsInfoContinue()')}</div>`;
SH.otp=()=>`<div class="inner">${titleBlock('Check your inbox',`We sent a 5-digit code to ${esc(S.email)}`)}
  <div class="otp">${[0,1,2,3,4].map(i=>`<div class="${i===S.otp.length?'cur':''}">${S.otp[i]||''}</div>`).join('')}</div>
  <p class="help" style="font-size:13px;color:var(--sub)">Didn't get the code? Check spam or <span id="resend">resend in 0:${String(timerV).padStart(2,'0')}</span></p>
  <div style="height:16px"></div>
  <div class="keypad">${['1','2','3','4','5','6','7','8','9','*','0','del'].map(k=>`<button onclick="key('${k}')" aria-label="${k==='del'?'Delete':k}">${k==='del'?I.del:k}</button>`).join('')}</div></div>`;
SH.upload=()=>{const d=DOCS.find(x=>x.id===S.sheet.doc);const isId=d.id==='id';return `<div class="inner">${titleBlock(d.t,isId?'Choose document type':'')}
  ${isId?`<div style="margin:14px 0">${chips(['Driver licence','Passport'],S.idType,'setIdType')}</div>`:'<div style="height:14px"></div>'}
  <div class="stack tight">${row({t:'Take a photo',s:isId?(S.idType==='Driver licence'?'Front and back — we\'ll guide you':'Photo page only'):'We\'ll guide you',on:`takePhoto('${d.id}')`})}
  ${row({t:'Choose a file',s:'JPG, PNG or PDF, up to 10 MB',on:`chooseFile('${d.id}')`})}
  <div class="note">Not ready? You can still browse shifts. You'll need this to apply.</div></div></div>`;};
SH.photo=()=>{const {doc,side}=S.sheet;const d=DOCS.find(x=>x.id===doc);const lic=doc==='id'&&S.idType==='Driver licence';
  const ttl=lic?(side==='front'?'Front of licence · 1 of 2':'Back of licence · 2 of 2'):(doc==='id'?'Passport · photo page':d.t);
  const back=side==='back';
  return `${header({title:ttl})}<div class="inner">${titleBlock('Check your photo','Make sure all details are easy to read.')}
  <div class="preview"><div class="idcard">
    <b style="left:16px;top:18px;width:150px;height:10px"></b>
    ${back?'':'<b style="left:16px;top:48px;width:70px;height:90px;background:#F5F5F5;border-radius:6px"></b>'}
    <b style="left:100px;top:52px;width:150px"></b><b style="left:100px;top:70px;width:120px"></b><b style="left:100px;top:88px;width:140px"></b><b style="left:100px;top:106px;width:90px"></b>
    <b style="left:16px;top:152px;width:${back?110:200}px"></b>${back?'<b style="right:16px;bottom:16px;width:120px;height:40px"></b>':''}
  </div></div>
  <div class="checks"><div>${I.check}All four corners are in the frame</div><div>${I.check}${back?'Card number is readable':'Text is sharp and readable'}</div><div>${I.check}No glare or shadows</div></div>
  <div class="stack tight">${btn(lic&&!back?'Next':'Confirm','primary','photoNext()')}${btn('Retake photo','secondary','retake()')}</div></div>`;};

/* sheets that sit on top of which screen */
const SHEET_BASE={docsInfo:'role',otp:'account',upload:'docs',photo:'docs'};

/* ---------- render ---------- */
function render(){
  const p=$('#phone'); let id=cur();
  if(S.sheet&&SHEET_BASE[S.sheet.name]&&id!==SHEET_BASE[S.sheet.name]) id=SHEET_BASE[S.sheet.name];
  p.innerHTML=`<section class="screen">${V[id]()}</section>${S.sheet?`<div class="overlay" onclick="${S.sheet.name==='otp'?'':'closeSheet()'}"></div><div class="sheet" role="dialog"><div class="grab"></div>${SH[S.sheet.name]()}</div>`:''}<div class="homebar"></div>`;
  // nav highlight
  const active=S.sheet?({docsInfo:'roleSheet',otp:'otp',upload:'upload',photo:S.sheet.side==='back'?'photoBack':'photoFront'})[S.sheet.name]:(id==='docs'&&Object.keys(S.docs).length?'docsDone':id);
  $('#nav').innerHTML=SCREENS.map(([k,l])=>`<li><button class="${k===active?'on':''}" onclick="jump('${k}')">${l}</button></li>`).join('');
}
render();
</script>
</body>
</html>
